# =========================================================
# 1. CẤU HÌNH KẾT NỐI CƠ SỞ DỮ LIỆU SQL SERVER
# =========================================================
server.port=8080

# Sửa databaseName thành QuanLyMuaNha_CaoOc cho khớp chính xác với SSMS
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyMuaNha_CaoOc;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true

# Tài khoản & Mật khẩu đăng nhập SQL Server
spring.datasource.username=sa
spring.datasource.password=12022006
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =========================================================
# 2. CẤU HÌNH JPA / HIBERNATE (NGẮN NGỪA TỰ TẠO BẢNG DƯ)
# =========================================================
spring.jpa.hibernate.ddl-auto=update

# Bắt buộc Hibernate giữ nguyên tên bảng đặt trong @Table(name = "...")
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Dialect cho SQL Server và hiển thị câu lệnh SQL trong Console để dễ debug
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# 3. CẤU HÌNH BẢNG MÃ UTF-8 HỆ THỐNG (FIX LỖI DẤU ?)
# =========================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================================================
# 4. CẤU HÌNH THYMELEAF & UPLOAD FILE
# =========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Cấu hình cho phép tải file lên đến 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cấu hình Tomcat không ngắt kết nối khi upload file lớn
server.tomcat.max-swallow-size=-1