# =========================================================
# 1. CẤU HÌNH PORT & KẾT NỐI CƠ SỞ DỮ LIỆU POSTGRESQL (RENDER)
# =========================================================
# Tự động lấy cổng PORT do Render cấp (Mặc định 8080 khi chạy local)
server.port=${PORT:8080}

# Cấu hình Datasource động: Ưu tiên lấy biến môi trường từ Render
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quanlycaooc}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# 2. CẤU HÌNH JPA / HIBERNATE CHO POSTGRESQL
# =========================================================
# Tự động tạo/cập nhật cấu trúc bảng
spring.jpa.hibernate.ddl-auto=update

# Cho phép Hibernate khởi tạo dữ liệu ban đầu từ data.sql (nếu có)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Bỏ cấu hình dialect thủ công để Hibernate 6 / Spring Boot 3.2 tự nhận diện tối ưu
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open-In-View warning (tối ưu hiệu năng kết nối CSDL)
spring.jpa.open-in-view=false

# =========================================================
# 3. CẤU HÌNH BẢNG MÃ UTF-8 HỆ THỐNG (FIX LỖI DẤU TIẾNG VIỆT)
# =========================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================================================
# 4. CẤU HÌNH THYMELEAF & UPLOAD FILE
# =========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Cấu hình cho phép tải file lên đến 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cấu hình Tomcat không ngắt kết nối khi upload file lớn
server.tomcat.max-swallow-size=-1
