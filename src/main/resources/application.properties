# =========================================================
# 1. CẤU HÌNH PORT & KẾT NỐI CƠ SỞ DỮ LIỆU POSTGRESQL (RENDER)
# =========================================================
# Tự động lấy cổng PORT do Render cấp (Mặc định 8080 khi chạy local)
server.port=${PORT:8080}

# Cấu hình Datasource động: Tự lấy biến môi trường trên Render, fallback về local nếu chạy máy nhà
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quanlycaooc}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# 2. CẤU HÌNH JPA / HIBERNATE CHO POSTGRESQL
# =========================================================
spring.jpa.hibernate.ddl-auto=update

# Giữ nguyên tên bảng/cột đặt trong @Table(name = "...") và @Column(name = "...")
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Dialect chuẩn cho PostgreSQL & Hiển thị SQL trong Console để debug
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# 3. CẤU HÌNH BẢNG MÃ UTF-8 HỆ THỐNG (FIX LỖI DẤU TIẾNG VIỆT)
# =========================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================================================
# 4. CẤU HÌNH THYMELEAF & UPLOAD FILE
# =========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Cấu hình cho phép tải file lên đến 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cấu hình Tomcat không ngắt kết nối khi upload file lớn
server.tomcat.max-swallow-size=-1
