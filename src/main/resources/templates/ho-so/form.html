<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${hoSo.maHoSo == null} ? 'Thêm Hồ Sơ Đăng Ký' : 'Sửa Hồ Sơ Đăng Ký'"></title>
    <style> /* THANH MENU ĐIỀU HƯỚNG */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #1e1e1e;
        padding: 12px 18px;
        border-radius: 8px;
        margin-bottom: 25px;
        border: 1px solid #333333;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .nav-links {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
    }
    .nav-item {
        color: #e0e0e0;
        text-decoration: none;
        padding: 8px 12px;
        border-radius: 5px;
        font-size: 14px;
        transition: 0.2s;
        font-weight: 500;
    }
    .nav-item:hover {
        background-color: #2c2c2c;
        color: #4da3ff;
    }
    .nav-item.active {
        background-color: #4da3ff;
        color: #ffffff;
        font-weight: bold;
    }
    .btn-logout {
        background-color: transparent;
        color: #f85149;
        border: 1px solid #f85149;
        padding: 8px 14px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 14px;
        transition: 0.2s;
        font-weight: bold;
    }
    .btn-logout:hover {
        background-color: #f85149;
        color: #ffffff;
    }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 30px; background-color: #121212; color: #e0e0e0; }
        .form-container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #333; }
        h2 { text-align: center; color: #ffffff; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #aaaaaa; }
        input, select, textarea { width: 100%; padding: 12px; background-color: #2c2c2c; border: 1px solid #444; color: #ffffff; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #4da3ff; }
        .btn { padding: 12px 20px; border: none; border-radius: 5px; color: white; cursor: pointer; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-submit { background-color: #2ea043; width: 48%; }
        .btn-submit:hover { background-color: #238636; }
        .btn-back { background-color: #3b3b3b; width: 48%; display: inline-block; text-align: center; box-sizing: border-box;}
        .btn-back:hover { background-color: #4c4c4c; }
        .button-group { display: flex; justify-content: space-between; margin-top: 25px; }
    </style>
</head>
<body> <!-- THANH MENU ĐIỀU HƯỚNG -->
<div class="navbar">
    <div class="nav-links">
        <a th:href="@{/}" class="nav-item">📊 Trang Chủ</a>
        <a th:href="@{/can-ho}" class="nav-item">🏢 Căn Hộ</a>
        <a th:href="@{/khach-hang}" class="nav-item">👥 Khách Hàng</a>
        <a th:href="@{/nhan-vien}" class="nav-item">👔 Nhân Viên</a>
        <a th:href="@{/lich-hen}" class="nav-item">📅 Lịch Hẹn</a>
        <a th:href="@{/ho-so}" class="nav-item">📑 Xét Duyệt Hồ Sơ</a>
        <a th:href="@{/thanh-toan}" class="nav-item">💰 Đặt Cọc & Thanh Toán</a>
    </div>
    <div>
        <a th:href="@{/logout}" class="btn-logout">Đăng Xuất</a>
    </div>
</div>

<div class="form-container">
    <h2 th:text="${hoSo.maHoSo == null} ? 'THÊM HỒ SƠ ĐĂNG KÝ' : 'CẬP NHẬT HỒ SƠ'"></h2>

    <form th:action="@{/ho-so/luu}" th:object="${hoSo}" method="post">

        <!-- Cột MaHoSo tự động tăng nên dùng thẻ hidden -->
        <input type="hidden" th:field="*{maHoSo}" />

        <div class="form-group">
            <label>Khách Hàng:</label>
            <select th:field="*{khachHang.maKhachHang}" required>
                <option value="">-- Chọn Khách Hàng --</option>
                <option th:each="kh : ${danhSachKhachHang}" th:value="${kh.maKhachHang}" th:text="${kh.tenKhachHang} + ' - ' + ${kh.soDienThoai}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Căn Hộ:</label>
            <select th:field="*{canHo.maCanHo}" required>
                <option value="">-- Chọn Căn Hộ --</option>
                <option th:each="ch : ${danhSachCanHo}" th:value="${ch.maCanHo}" th:text="${ch.tenCanHo}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Nhân Viên Phụ Trách:</label>
            <select th:field="*{nhanVien.maNhanVien}" required>
                <option value="">-- Chọn Nhân Viên --</option>
                <option th:each="nv : ${danhSachNhanVien}" th:value="${nv.maNhanVien}" th:text="${nv.tenNhanVien}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Ngày Lập Hồ Sơ:</label>
            <input type="date" th:field="*{ngayLap}" required />
        </div>

        <div class="form-group">
            <label>Giá Thỏa Thuận (VNĐ):</label>
            <input type="number" step="any" th:field="*{giaThoaThuan}" placeholder="Ví dụ: 2500000000" />
        </div>

        <div class="form-group">
            <label>Trạng Thái:</label>
            <select th:field="*{trangThai}">
                <option value="Chờ duyệt">Chờ duyệt</option>
                <option value="Đã duyệt">Đã duyệt</option>
                <option value="Hoàn tất">Hoàn tất</option>
                <option value="Đã hủy">Đã hủy</option>
            </select>
        </div>

        <div class="form-group">
            <label>Ghi Chú:</label>
            <textarea th:field="*{ghiChu}" rows="3" placeholder="Nhập ghi chú..."></textarea>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-submit">Lưu Dữ Liệu</button>
            <a th:href="@{/ho-so}" class="btn btn-back">Hủy Bỏ</a>
        </div>
    </form>
</div>

</body>
</html>
