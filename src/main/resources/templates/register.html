<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - T&C Real Estate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
        }
    </style>
</head>
<body>

<div class="card register-card p-4 bg-white">
    <div class="text-center mb-3">
        <h3 class="fw-bold text-primary">ĐĂNG KÝ TÀI KHOẢN</h3>
        <p class="text-muted">Tạo tài khoản quản trị/nhân viên mới</p>
    </div>

    <div th:if="${error}" class="alert alert-danger py-2 text-center" role="alert" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${nguoiDung}" method="post">
        <div class="mb-3">
            <label class="form-label fw-bold">Họ và Tên:</label>
            <input type="text" th:field="*{hoTen}" class="form-control" placeholder="Nhập họ và tên..." required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Email:</label>
            <input type="email" th:field="*{email}" class="form-control" placeholder="example@tcgroup.vn" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Tên Đăng Nhập:</label>
            <input type="text" th:field="*{tenDangNhap}" class="form-control" placeholder="Nhập tên đăng nhập..." required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Mật Khẩu:</label>
            <input type="password" th:field="*{matKhau}" class="form-control" placeholder="Nhập mật khẩu..." required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">Vai Trò:</label>
            <select th:field="*{vaiTro}" class="form-select">
                <option value="Nhân viên">Nhân viên kinh doanh</option>
                <option value="Quản trị">Quản trị hệ thống</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success w-100 fw-bold py-2">ĐĂNG KÝ TÀI KHOẢN</button>
    </form>

    <div class="text-center mt-3">
        <span class="text-muted">Đã có tài khoản?</span>
        <a href="/login" class="text-primary fw-bold text-decoration-none">Đăng nhập ngay</a>
    </div>
</div>

</body>
</html>
