<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${canHo.maCanHo == null || canHo.maCanHo == ''} ? 'Thêm Căn Hộ Mới' : 'Cập Nhật Căn Hộ'"></title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 20px;
            background-color: #121212;
            color: #e0e0e0;
        }

        /* THANH MENU ĐIỀU HƯỚNG */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e1e1e;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #333333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .nav-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .nav-item {
            color: #e0e0e0;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            transition: 0.2s;
            font-weight: 500;
        }
        .nav-item:hover {
            background-color: #2c2c2c;
            color: #4da3ff;
        }
        .nav-item.active {
            background-color: #4da3ff;
            color: #ffffff;
            font-weight: bold;
        }
        .btn-logout {
            background-color: transparent;
            color: #f85149;
            border: 1px solid #f85149;
            padding: 8px 14px;
        }
        .btn-logout:hover {
            background-color: #f85149;
            color: #ffffff;
        }

        /* FORM CONTAINER */
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h2 { text-align: center; color: #ffffff; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #aaaaaa; }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #ffffff;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus { outline: none; border-color: #4da3ff; }
        input::placeholder { color: #666666; }
        input[readonly] { background-color: #222222; color: #888888; }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-submit { background-color: #2ea043; width: 48%; }
        .btn-submit:hover { background-color: #238636; }
        .btn-back { background-color: #3b3b3b; width: 48%; display: inline-block; text-align: center; box-sizing: border-box;}
        .btn-back:hover { background-color: #4c4c4c; }
        .button-group { display: flex; justify-content: space-between; margin-top: 20px; }
    </style>
</head>
<body>

<!-- THANH MENU ĐIỀU HƯỚNG -->
<div class="navbar">
    <div class="nav-links">
        <a th:href="@{/}" class="nav-item">📊 Trang Chủ</a>
        <a th:href="@{/can-ho}" class="nav-item active">🏢 Căn Hộ</a>
        <a th:href="@{/khach-hang}" class="nav-item">👥 Khách Hàng</a>
        <a th:href="@{/nhan-vien}" class="nav-item">👔 Nhân Viên</a>
        <a th:href="@{/lich-hen}" class="nav-item">📅 Lịch Hẹn</a>
        <a th:href="@{/ho-so}" class="nav-item">📑 Xét Duyệt Hồ Sơ</a>
        <a th:href="@{/thanh-toan}" class="nav-item">💰 Đặt Cọc & Thanh Toán</a>
    </div>
    <div>
        <a th:href="@{/logout}" class="btn btn-logout">Đăng Xuất</a>
    </div>
</div>

<div class="form-container">
    <h2 th:text="${canHo.maCanHo == null || canHo.maCanHo == ''} ? 'THÊM CĂN HỘ MỚI' : 'CẬP NHẬT CĂN HỘ'"></h2>

    <form th:action="@{/can-ho/luu}" th:object="${canHo}" method="post">

        <div class="form-group">
            <label>Mã Căn Hộ:</label>
            <input type="text" th:field="*{maCanHo}"
                   th:readonly="${canHo.maCanHo != null && canHo.maCanHo != ''}"
                   required placeholder="Ví dụ: CH03" />
        </div>

        <!-- Ô NHẬP LINK HÌNH ẢNH URL -->
        <div class="form-group">
            <label>Link Hình Ảnh (URL Online):</label>
            <input type="text" th:field="*{hinhAnh}" id="inputHinhAnh"
                   placeholder="Dán link ảnh (VD: https://images.unsplash.com/...)" 
                   oninput="previewImage(this.value)" />
            <small style="color: #888888; font-size: 12px; margin-top: 4px; display: block;">
                💡 Dán đường dẫn URL ảnh từ Google / Unsplash / Imgur.
            </small>

            <!-- Khung xem trước ảnh -->
            <div id="previewContainer" style="margin-top: 10px; display: none;">
                <small style="color: #aaaaaa;">Xem trước hình ảnh:</small><br/>
                <img id="imgPreview" style="max-width: 100%; max-height: 180px; border-radius: 8px; margin-top: 5px; border: 1px solid #444; object-fit: cover;" 
                     onerror="this.style.display='none'" />
            </div>
        </div>

        <div class="form-group">
            <label>Tên Căn Hộ:</label>
            <input type="text" th:field="*{tenCanHo}" required placeholder="Ví dụ: Căn hộ A301" />
        </div>

        <div class="form-group">
            <label>Loại Căn Hộ:</label>
            <input type="text" th:field="*{loaiCanHo}" placeholder="Ví dụ: 2 Phòng ngủ" />
        </div>

        <div class="form-group">
            <label>Diện Tích (m²):</label>
            <input type="number" step="0.1" th:field="*{dienTich}" placeholder="Ví dụ: 75.5" />
        </div>

        <div class="form-group">
            <label>Số Tầng:</label>
            <input type="number" th:field="*{soTang}" placeholder="Ví dụ: 8" />
        </div>

        <div class="form-group">
            <label>Giá Bán (VNĐ):</label>
            <input type="number" step="1000000" th:field="*{giaBan}" placeholder="Ví dụ: 2500000000" />
        </div>

        <div class="form-group">
            <label>Trạng Thái:</label>
            <select th:field="*{trangThai}">
                <option value="Còn trống">Còn trống</option>
                <option value="Đã cọc">Đã cọc</option>
                <option value="Đã bán">Đã bán</option>
            </select>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-submit">Lưu Dữ Liệu</button>
            <a th:href="@{/can-ho}" class="btn btn-back">Hủy Bỏ</a>
        </div>
    </form>
</div>

<script>
    function previewImage(url) {
        var container = document.getElementById('previewContainer');
        var img = document.getElementById('imgPreview');
        if (url && url.trim() !== '') {
            img.src = url;
            img.style.display = 'block';
            container.style.display = 'block';
        }
