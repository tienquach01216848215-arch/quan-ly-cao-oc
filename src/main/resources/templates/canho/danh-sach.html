<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Căn Hộ</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20px; background-color: #121212; color: #e0e0e0; }
        h2 { color: #ffffff; }

        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; padding: 12px 18px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333333; }
        .nav-links { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .nav-item { color: #e0e0e0; text-decoration: none; padding: 8px 12px; border-radius: 5px; font-size: 14px; font-weight: 500; }
        .nav-item:hover { background-color: #2c2c2c; color: #4da3ff; }
        .nav-item.active { background-color: #4da3ff; color: #ffffff; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #333333; padding: 12px; text-align: left; vertical-align: middle; }
        th { background-color: #2c2c2c; color: #4da3ff; font-weight: bold; }
        tr:hover { background-color: #2a2a2a; }

        .btn { padding: 8px 14px; text-decoration: none; color: white; border-radius: 5px; display: inline-block; font-size: 14px; }
        .btn-add { background-color: #2ea043; margin-bottom: 15px; font-weight: bold; }
        .btn-add:hover { background-color: #238636; }
        .btn-edit { background-color: #d29922; color: #ffffff; }
        .btn-edit:hover { background-color: #bd8a1f; }
        .btn-delete { background-color: #f85149; }
        .btn-delete:hover { background-color: #da3633; }
        .btn-logout { background-color: transparent; color: #f85149; border: 1px solid #f85149; }
        .btn-logout:hover { background-color: #f85149; color: #ffffff; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-links">
        <a th:href="@{/}" class="nav-item">📊 Trang Chủ</a>
        <a th:href="@{/can-ho}" class="nav-item active">🏢 Căn Hộ</a>
        <a th:href="@{/khach-hang}" class="nav-item">👥 Khách Hàng</a>
        <a th:href="@{/nhan-vien}" class="nav-item">👔 Nhân Viên</a>
        <a th:href="@{/lich-hen}" class="nav-item">📅 Lịch Hẹn</a>
        <a th:href="@{/ho-so}" class="nav-item">📑 Xét Duyệt Hồ Sơ</a>
        <a th:href="@{/thanh-toan}" class="nav-item">💰 Đặt Cọc & Thanh Toán</a>
    </div>
    <div>
        <a th:href="@{/logout}" class="btn btn-logout">Đăng Xuất</a>
    </div>
</div>

<h2>Quản Lý Danh Sách Căn Hộ</h2>

<a th:href="@{/can-ho/them}" class="btn btn-add">+ Thêm Căn Hộ Mới</a>

<table>
    <thead>
    <tr>
        <th>Mã Căn Hộ</th>
        <th>Hình Ảnh</th>
        <th>Tên Căn Hộ</th>
        <th>Loại Căn Hộ</th>
        <th>Diện Tích (m²)</th>
        <th>Số Tầng</th>
        <th>Giá Bán</th>
        <th>Trạng Thái</th>
        <th>Hành Động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ch : ${danhSachCanHo}">
        <td th:text="${ch?.maCanHo}"></td>

        <td style="text-align: center;">
            <img th:if="${ch?.hinhAnh}"
                 th:src="@{'/images/' + ${ch.hinhAnh}}"
                 style="width: 80px; height: 60px; object-fit: cover; border-radius: 6px;" />
            <span th:unless="${ch?.hinhAnh}" style="color: #888888; font-size: 13px;">Chưa có ảnh</span>
        </td>

        <td th:text="${ch?.tenCanHo}"></td>
        <td th:text="${ch?.loaiCanHo}"></td>
        <td th:text="${ch?.dienTich}"></td>
        <td th:text="${ch?.soTang}"></td>
        <td th:text="${ch?.giaBan != null ? #numbers.formatDecimal(ch.giaBan, 0, 'COMMA', 0, 'POINT') + ' VNĐ' : 'Chưa cập nhật'}"></td>
        <td th:text="${ch?.trangThai}"></td>
        <td>
            <a th:href="@{/can-ho/sua/{id}(id=${#strings.trim(ch.maCanHo)})}" class="btn btn-edit">Sửa</a>
            <a th:href="@{/can-ho/xoa/{id}(id=${#strings.trim(ch.maCanHo)})}" class="btn btn-delete"
               onclick="return confirm('Bạn có chắc chắn muốn xóa căn hộ này?');">Xóa</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
