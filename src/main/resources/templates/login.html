<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - T&C Real Estate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body>

<div class="card login-card p-4 bg-white">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">🏢 T&C REAL ESTATE</h2>
        <p class="text-muted fs-6">Hệ Thống Quản Lý Bán & Đăng Ký Căn Hộ</p>
    </div>

    <!-- THÔNG BÁO LỖI (NẾU ĐĂNG NHẬP THẤT BẠI) -->
    <div th:if="${error}" class="alert alert-danger py-2 text-center" role="alert" th:text="${error}">
        Tên đăng nhập hoặc mật khẩu không chính xác!
    </div>

    <!-- THÔNG BÁO THÀNH CÔNG (KHI MỚI ĐĂNG KÝ XONG) -->
    <div th:if="${success}" class="alert alert-success py-2 text-center" role="alert" th:text="${success}">
        Đăng ký thành công! Mời đăng nhập.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-bold">Tên Đăng Nhập</label>
            <input type="text" name="tenDangNhap" class="form-control" placeholder="Nhập tên đăng nhập..." required autofocus>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">Mật Khẩu</label>
            <input type="password" name="matKhau" class="form-control" placeholder="Nhập mật khẩu..." required>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 fs-6">ĐĂNG NHẬP</button>
    </form>

    <div class="text-center mt-4">
        <span class="text-muted">Chưa có tài khoản?</span>
        <a href="/register" class="text-primary fw-bold text-decoration-none">Đăng ký ngay</a>
    </div>
</div>

</body>
</html>
