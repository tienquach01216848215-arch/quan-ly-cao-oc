<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Portal - Căn Hộ Cao Cấp</title>
    <style>
        /* --- NAVBAR --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e1e1e;
            padding: 15px 50px;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #4da3ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-link {
            color: #e0e0e0;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            padding: 8px 14px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .nav-link:hover, .nav-link.active {
            background-color: #2c2c2c;
            color: #4da3ff;
        }
        .btn-nav-primary {
            background-color: #2ea043;
            color: #ffffff !important;
            font-weight: bold;
        }
        .btn-nav-primary:hover {
            background-color: #238636 !important;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
        }

        /* LƯỚI DANH SÁCH CĂN HỘ */
        .apartment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .apartment-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .apartment-card:hover {
            transform: translateY(-5px);
        }

        /* KHUNG HÌNH ẢNH */
        .apartment-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #2c2c2c;
        }

        .apartment-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .apartment-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .apartment-info {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 6px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #2ea043
