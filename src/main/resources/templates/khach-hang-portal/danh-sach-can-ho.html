<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Portal - Căn Hộ Cao Cấp</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background-color: #121212; color: #e0e0e0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; padding: 15px 50px; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 1000; margin-bottom: 30px; }
        .logo { font-size: 22px; font-weight: bold; color: #4da3ff; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-link { color: #e0e0e0; text-decoration: none; padding: 8px 14px; border-radius: 6px; }
        .nav-link.active { background-color: #2c2c2c; color: #4da3ff; }
        .btn-nav-primary { background-color: #2ea043; color: #fff !important; font-weight: bold; }
        h2 { text-align: center; color: #ffffff; margin-bottom: 30px; }
        .apartment-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .apartment-card { background-color: #1e1e1e; border-radius: 12px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; }
        .apartment-img { width: 100%; height: 200px; object-fit: cover; background-color: #2c2c2c; }
        .apartment-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .apartment-title { font-size: 20px; font-weight: bold; color: #ffffff; margin-bottom: 10px; }
        .apartment-info { font-size: 14px; color: #b0b0b0; margin-bottom: 6px; }
        .price { font-size: 18px; font-weight: bold; color: #2ea043; margin: 15px 0; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px; }
        .bg-success { background-color: #238636; color: white; }
        .bg-warning { background-color: #d29922; color: white; }
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 10px; text-align: center; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-primary { background-color: #4da3ff; color: #fff; }
        .btn-success { background-color: #2ea043; color: #fff; }
    </style>
</head>
<body>

<nav class="navbar">
    <a th:href="@{/khach-hang-portal}" class="logo">🏢 Căn Hộ T&C</a>
    <div class="nav-links">
        <a th:href="@{/khach-hang-portal}" class="nav-link">🏠 Trang Chủ</a>
        <a th:href="@{/khach-hang-portal/can-ho}" class="nav-link active">🏢 Căn Hộ</a>
        <a th:href="@{/khach-hang-portal/dat-lich}" class="nav-link">📅 Đặt Lịch Xem</a>
        <a th:href="@{/khach-hang-portal/dat-coc}" class="nav-link btn-nav-primary">💰 Đặt Cọc Online</a>
    </div>
</nav>

<h2>🏢 DANH SÁCH CĂN HỘ DÀNH CHO KHÁCH HÀNG</h2>

<div class="apartment-grid">
    <div class="apartment-card" th:each="ch : ${danhSachCanHo}">

        <!-- XỬ LÝ ẢNH CHỐNG NULL & ĐƯỜNG DẪN CLOUDINARY -->
        <img th:src="${ch?.hinhAnh != null and ch.hinhAnh.startsWith('http') ? ch.hinhAnh : (ch?.hinhAnh != null and ch.hinhAnh != '' ? '/images/' + ch.hinhAnh : 'https://raw.githubusercontent.com/tienquach01216848215-arch/quan-ly-cao-oc/main/src/main/resources/static/images/messi_toanha.jpg')}"
             onerror="this.src='https://raw.githubusercontent.com/tienquach01216848215-arch/quan-ly-cao-oc/main/src/main/resources/static/images/messi_toanha.jpg'"
             class="apartment-img"
             alt="Hình căn hộ" />

        <div class="apartment-body">
            <div>
                <div class="apartment-title" th:text="${ch?.tenCanHo != null ? ch.tenCanHo : 'Căn hộ'}">Tên căn hộ</div>
                <div class="apartment-info">Mã căn hộ: <strong th:text="${ch?.maCanHo}"></strong></div>
                <div class="apartment-info">Loại: <span th:text="${ch?.loaiCanHo}"></span></div>
                <div class="apartment-info">
                    Diện tích: <span th:text="${ch?.dienTich != null ? ch.dienTich + ' m²' : 'N/A'}"></span> |
                    Tầng: <span th:text="${ch?.soTang != null ? ch.soTang : 'N/A'}"></span>
                </div>

                <!-- ĐÃ SỬA THAM SỐ ĐỊNH DẠNG SỐ NGUYÊN TỪ 0 THÀNH 1 -->
                <div class="price" th:text="${ch?.giaBan != null ? #numbers.formatDecimal(ch.giaBan, 1, 'COMMA', 0, 'POINT') + ' VNĐ' : 'Liên hệ'}"></div>

                <span class="status-badge"
                      th:classappend="${ch?.trangThai == 'Còn trống'} ? 'bg-success' : 'bg-warning'"
                      th:text="${ch?.trangThai != null ? ch.trangThai : 'Chưa cập nhật'}">
                </span>
            </div>

            <div class="btn-group">
                <a th:href="@{/khach-hang-portal/dat-lich(maCanHo=${ch?.maCanHo})}" class="btn btn-primary">📅 Đặt Lịch Xem</a>
                <a th:href="@{/khach-hang-portal/dat-coc(maCanHo=${ch?.maCanHo})}" class="btn btn-success">💰 Đặt Cọc</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
