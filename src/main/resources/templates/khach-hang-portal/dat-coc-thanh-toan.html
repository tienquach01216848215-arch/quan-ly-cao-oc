<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Cọc & Thanh Toán - Cao Ốc Residence</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; line-height: 1.6; }

        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; padding: 15px 50px; border-bottom: 1px solid #333; }
        .logo { font-size: 22px; font-weight: bold; color: #4da3ff; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; }
        .nav-link { color: #e0e0e0; text-decoration: none; font-weight: 500; padding: 8px 14px; border-radius: 6px; }
        .nav-link.active { background-color: #2c2c2c; color: #4da3ff; }

        .container { max-width: 600px; margin: 40px auto; padding: 30px; background-color: #1e1e1e; border-radius: 10px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ffffff; margin-bottom: 20px; font-size: 24px; }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #cccccc; }
        input, select { width: 100%; padding: 12px; background-color: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #ffffff; font-size: 14px; }
        input:focus, select:focus { border-color: #4da3ff; outline: none; }

        select option:disabled { color: #888; background-color: #1a1a1a; }

        .btn-submit { width: 100%; padding: 12px; background-color: #2ea043; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background-color: #238636; }

        .alert-danger { background-color: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.4); padding: 12px; border-radius: 6px; margin-bottom: 20px; text-align: center; }

        /* KHUNG HIỂN THỊ MÃ QR CODE */
        .qr-container { display: none; margin-top: 15px; padding: 20px; background-color: #242424; border: 1px solid #4da3ff; border-radius: 8px; text-align: center; }
        .qr-container h4 { color: #4da3ff; margin-bottom: 10px; font-size: 16px; }
        .qr-image { max-width: 240px; border-radius: 8px; border: 2px solid #ffffff; margin: 10px 0; }
        .qr-desc { font-size: 13px; color: #aaaaaa; }
    </style>
</head>
<body>

<nav class="navbar">
    <a th:href="@{/khach-hang-portal}" class="logo">🏢 CAO ỐC RESIDENCE</a>
    <div class="nav-links">
        <a th:href="@{/khach-hang-portal}" class="nav-link">🏠 Trang Chủ</a>
        <a th:href="@{/khach-hang-portal/can-ho}" class="nav-link">🏢 Căn Hộ</a>
        <a th:href="@{/khach-hang-portal/dat-lich}" class="nav-link">📅 Đặt Lịch Xem</a>
        <a th:href="@{/khach-hang-portal/dat-coc}" class="nav-link active">💰 Đặt Cọc Online</a>
    </div>
</nav>

<div class="container">
    <h2>💰 ĐẶT CỌC CĂN HỘ</h2>

    <!-- Cảnh báo nếu căn hộ đã bị cọc -->
    <div th:if="${errorMessage}" class="alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/khach-hang-portal/dat-coc/luu}" method="post">
        <div class="form-group">
            <label>Họ và Tên (*):</label>
            <input type="text" name="tenKhachHang" placeholder="Nhập họ và tên..." required />
        </div>

        <div class="form-group">
            <label>Số Điện Thoại (*):</label>
            <input type="tel" name="soDienThoai" placeholder="Nhập số điện thoại..." required />
        </div>

        <!-- CHỌN CĂN HỘ (Khóa chọn nếu căn hộ Đã Cọc) -->
        <div class="form-group">
            <label>Chọn Căn Hộ (*):</label>
            <select name="maCanHo" required>
                <option value="">-- Chọn căn hộ muốn đặt cọc --</option>
                <option th:each="ch : ${danhSachCanHo}"
                        th:value="${ch.maCanHo}"
                        th:text="${ch.tenCanHo + ' - Tầng ' + ch.soTang + (ch.trangThai == 'Đã cọc' ? ' 🚫 [ĐÃ CỌC - KHÔNG THỂ CHỌN]' : '')}"
                        th:selected="${ch.maCanHo == selectedMaCanHo}"
                        th:disabled="${ch.trangThai == 'Đã cọc'}"> <!-- Vô hiệu hóa nếu Đã cọc -->
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Số Tiền Cọc (VNĐ) (*):</label>
            <input type="number" name="soTienCoc" value="50000000" min="1000000" step="1000000" required />
        </div>

        <!-- CHỌN PHƯƠNG THỨC THANH TOÁN -->
        <div class="form-group">
            <label>Phương Thức Thanh Toán (*):</label>
            <select name="phuongThuc" id="phuongThucSelect" onchange="toggleQRCode()" required>
                <option value="Tiền mặt">💵 Tiền mặt (Thanh toán tại văn phòng)</option>
                <option value="Chuyển khoản">📲 Chuyển khoản Ngân hàng (Quét QR)</option>
            </select>
        </div>

        <!-- KHUNG HIỂN THỊ MÃ QR CODE CHUYỂN KHOẢN -->
        <div id="qrContainer" class="qr-container">
            <h4>📲 Quét mã QR để chuyển khoản</h4>
            <!-- Nếu bạn có file ảnh QR riêng, hãy lưu tại static/images/qr-bank.jpg -->
            <img id="qrImage" src="/images/qr-bank.jpg" class="qr-image" alt="Mã QR Chuyển Khoản"
                 onerror="this.src='https://img.vietqr.io/image/MB-0345678999-compact2.png?amount=50000000&addInfo=DAT%20COC%20CAN%20HO'"/>
            <p class="qr-desc">Vui lòng mở ứng dụng Ngân hàng (MB, Vietcombank, Techcombank...) quét mã để hoàn tất đặt cọc.</p>
        </div>

        <button type="submit" class="btn-submit">XÁC NHẬN ĐẶT CỌC</button>
    </form>
</div>

<script>
    function toggleQRCode() {
        var selectBox = document.getElementById("phuongThucSelect");
        var qrBox = document.getElementById("qrContainer");
        if (selectBox.value === "Chuyển khoản") {
            qrBox.style.display = "block";
        } else {
            qrBox.style.display = "none";
        }
    }
</script>

</body>
</html>
