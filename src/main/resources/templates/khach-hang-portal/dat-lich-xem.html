<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt Lịch Xem Căn Hộ</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20px; background-color: #121212; color: #e0e0e0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; padding: 12px 18px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #333; }
        .nav-links { display: flex; gap: 8px; }
        .nav-item { color: #e0e0e0; text-decoration: none; padding: 8px 12px; border-radius: 5px; font-size: 14px; }
        .nav-item:hover, .nav-item.active { background-color: #4da3ff; color: #fff; font-weight: bold; }

        .form-container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 10px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ffffff; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #aaaaaa; }
        input, select, textarea { width: 100%; padding: 12px; background-color: #2c2c2c; border: 1px solid #444; color: #ffffff; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .btn-submit { width: 100%; padding: 12px; background-color: #38bdf8; color: #121212; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-submit:hover { background-color: #0284c7; color: white; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-links">
        <a th:href="@{/khach-hang-portal}" class="nav-item">🏠 Trang Chủ</a>
        <a th:href="@{/khach-hang-portal/can-ho}" class="nav-item">🏢 Xem Căn Hộ</a>
        <a th:href="@{/khach-hang-portal/dat-lich}" class="nav-item active">📅 Đặt Lịch Xem Nhà</a>
        <a th:href="@{/khach-hang-portal/dat-coc}" class="nav-item">💰 Đặt Cọc & Thanh Toán</a>
    </div>
</div>

<div class="form-container">
    <h2>📅 ĐẶT LỊCH XEM CĂN HỘ</h2>

    <form th:action="@{/khach-hang-portal/dat-lich/luu}" method="post">
        <div class="form-group">
            <label>Họ và Tên Khách Hàng:</label>
            <input type="text" name="tenKhachHang" required placeholder="Nhập họ và tên..." />
        </div>

        <div class="form-group">
            <label>Số Điện Thoại Liên Hệ:</label>
            <input type="text" name="soDienThoai" required placeholder="Nhập số điện thoại..." />
        </div>

        <div class="form-group">
            <label>Email (nếu có):</label>
            <input type="email" name="email" placeholder="example@gmail.com" />
        </div>

        <div class="form-group">
            <label>Chọn Căn Hộ Muốn Xem:</label>
            <select name="maCanHo" required>
                <option value="">-- Chọn Căn Hộ --</option>
                <option th:each="ch : ${danhSachCanHo}"
                        th:value="${ch.maCanHo}"
                        th:text="${ch.tenCanHo} + ' (' + ${ch.loaiCanHo} + ')'"
                        th:selected="${ch.maCanHo == selectedMaCanHo}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Ngày Muốn Muốn Đến Xem:</label>
            <input type="date" name="ngayHen" required />
        </div>

        <div class="form-group">
            <label>Ghi Chú Thêm:</label>
            <textarea name="ghiChu" rows="3" placeholder="Ví dụ: Muốn xem nhà vào buổi sáng..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Xác Nhận Đặt Lịch</button>
    </form>
</div>

</body>
</html>
